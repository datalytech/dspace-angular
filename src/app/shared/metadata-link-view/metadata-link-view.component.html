<div class="d-inline-block">
  <ng-container *ngIf="metadataView$ | async as metadataView">
    <ng-container
      [ngTemplateOutlet]="metadataView?.authority ? linkToAuthority : (metadataView?.entityType ? textWithIcon : textWithoutIcon)"
      [ngTemplateOutletContext]="{ metadataView: metadataView }">
    </ng-container>
  </ng-container>
</div>
  <ng-template class="d-flex" #linkToAuthority let-metadataView="metadataView">
    <div class="item-wrapper">
      <ds-metadata-link-view-orcid
        [orcidContributors]="namesOrcidMap"
        [currentContributorName]="metadataView.value.trim()"
        class="d-flex align-self-center">
      </ds-metadata-link-view-orcid>
      <span [ngbPopover]="popContent"
            [closeDelay]="500"
            [openDelay]="1000"
            [animation]="true"
            [autoClose]="'outside'"
            container="body"
            triggers="mouseenter:mouseleave">
<!--        <a rel="noopener noreferrer" data-test="linkToAuthority"
          [routerLink]="['/items/' + metadataView.authority]">
	   <span dsEntityIcon
                [iconPosition]="iconPosition"
                [entityType]="metadataView.entityType"
                [entityStyle]="metadataView.entityStyle">
		   {{metadataView.value}}
	  </span>
</a>-->
	<a rel="noopener noreferrer"
   		data-test="linkToAuthority"
		[routerLink]="['/items', metadataView.authority]">

	  <ng-container *ngIf="metadataView.entityType; else plainLinkedText">
    		<span dsEntityIcon
          	[iconPosition]="iconPosition"
          	[entityType]="metadataView.entityType"
          	[entityStyle]="metadataView.entityStyle">
      		{{ metadataView.value }}
    		</span>
  	  </ng-container>

  	  <ng-template #plainLinkedText>
    		{{ metadataView.value }}
  	  </ng-template>
	</a>
      </span>
      <img *ngIf="metadataView.orcidAuthenticated"
          placement="top"
          ngbTooltip="{{ metadataView.orcidAuthenticated }}"
          class="orcid-icon"
          alt="orcid-logo"
          src="assets/images/orcid.logo.icon.svg"
          data-test="orcidIcon"/>
    </div>
  </ng-template>

  <ng-template #textWithIcon let-metadataView="metadataView">
    <div class="item-wrapper">
      <ds-metadata-link-view-orcid
        [orcidContributors]="namesOrcidMap"
        [currentContributorName]="metadataView.value.trim()"
        class="d-flex align-self-center">
      </ds-metadata-link-view-orcid>
      <span dsEntityIcon
            data-test="textWithIcon"
            [iconPosition]="iconPosition"
            [entityType]="metadataView.entityType"
            [entityStyle]="metadataView.entityStyle"
            [fallbackOnDefault]="false">
            {{normalizeValue(metadataView.value)}}
      </span>
    </div>
  </ng-template>

  <ng-template #textWithoutIcon let-metadataView="metadataView">
    <div class="item-wrapper">
      <ds-metadata-link-view-orcid
        [orcidContributors]="namesOrcidMap"
        [currentContributorName]="metadataView.value.trim()"
        class="d-flex align-self-center">
      </ds-metadata-link-view-orcid>
      <span data-test="textWithoutIcon">{{normalizeValue(metadataView.value)}}</span>
    </div>
  </ng-template>
  <ng-template #popContent>
  <ds-metadata-link-view-popover
    *ngIf="relatedItem"
    [item]="relatedItem">
  </ds-metadata-link-view-popover>
  </ng-template>
