<div class="background-image-container mt-ncs">
  <div class="container">
    <div class="jumbotron jumbotron-fluid">
      <div class="d-flex flex-wrap">
        <div>
          <p>{{ 'home.text1' | translate}}</p>
          <p>{{ 'home.text2' | translate}}</p>
          <p>{{ 'home.text3' | translate}}</p>
        </div>
      </div>
    </div>
  </div>
  <picture class="background-image">
<source type="image/jpg" srcset="assets/dspace/images/banner_ucy.png 2000w, assets/dspace/images/banner_ucy.png 1200w, assets/dspace/images/banner_ucy.png 768w">
    <img alt="" [src]="'assets/dspace/images/banner_ucy.png'"/><!-- without the []="''" Firefox downloads both the fallback and the resolved image -->

  </picture>
</div>
