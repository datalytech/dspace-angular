# Mounts the source tree from the host into the running container, so that the `ng serve` watcher
# inside it recompiles on change. Without it the source is only copied into the image by `ADD . /app/`
# at build time, and every change needs the image rebuilt before it can be seen.
#
# Pass it explicitly, on top of the base file:
#
#   cd docker && docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Deliberately NOT named docker-compose.override.yml: Compose would then merge it into every run,
# including a production one, and bind mount the working tree over the image a deployment is meant
# to be serving.
#
# Only for the development image (Dockerfile / `yarn serve`). The dist image serves a build made at
# image build time and has no compiler, so mounting sources into it does nothing.
services:
  dspace-angular:
    volumes:
    # Not the whole repository: mounting over /app would hide the node_modules installed in the image.
    - ../src:/app/src
    - ../config:/app/config
    # The watcher relies on inotify events crossing the bind mount, which works on Linux hosts. On a
    # host where they do not (Docker Desktop on macOS or Windows, some network filesystems), tell the
    # dev server to poll instead by uncommenting the line below.
    # command: yarn serve --host 0.0.0.0 --poll 2000
